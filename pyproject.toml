[project]
name = "hermes-homeassistant-deliver"
version = "2.1.0"
description = "Home Assistant gateway platform and smart-home tools for Hermes Agent — unofficial fork adding deliver/deliver_mode for watched events"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nous Research" }]
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/Bendak/hermes-homeassistant-deliver"
Upstream = "https://github.com/NousResearch/hermes-official-plugins/tree/main/homeassistant"
