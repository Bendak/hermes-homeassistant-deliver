name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: plugin · ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Through uv with core's [tool.uv] override-dependencies, the way Hermes installs
      # itself: core overrides vendor pins that plain pip cannot resolve
      # (browser-harness's pillow==12.3.0 vs core's Pillow 13.0.0).
      - name: Install hermes-agent and the plugin's dependencies
        shell: bash
        run: |
          python -m pip install uv
          python -c 'import sys,tomllib; print("\n".join(tomllib.load(open(sys.argv[1], "rb")).get("tool", {}).get("uv", {}).get("override-dependencies", [])))' hermes-agent/pyproject.toml > "$RUNNER_TEMP/core-overrides.txt"
          pyexe=$(python -c 'import sys; print(sys.executable)')
          python -m uv pip install --python "$pyexe" --override "$RUNNER_TEMP/core-overrides.txt" -e ./hermes-agent pytest pytest-asyncio
          deps=$(python -c 'import pathlib,sys,tomllib; p=pathlib.Path(sys.argv[1]); print("\n".join(tomllib.loads(p.read_text())["project"].get("dependencies", [])) if p.is_file() else "")' plugin/pyproject.toml)
          if [ -n "$deps" ]; then printf '%s\n' "$deps" > "$RUNNER_TEMP/plugin-reqs.txt"; python -m uv pip install --python "$pyexe" --override "$RUNNER_TEMP/core-overrides.txt" -r "$RUNNER_TEMP/plugin-reqs.txt"; fi
      - name: Validate the manifest against core
        shell: bash
        run: python -m hermes_cli.main plugins validate plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Run the plugin suite
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
